[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "wheel"]

[project]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.8", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Networking"]
dependencies = ["jsonschema>=4.0.0", "watchdog>=2.0.0", "pyyaml>=6.0"]
description = "A general-purpose file-based API communication library"
keywords = ["api", "file-based", "ipc", "communication", "polling"]
name = "fbapi"
readme = "README.md"
requires-python = ">=3.8"
version = "0.5.11962"

[[project.authors]]
name = "fbapi contributors"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-asyncio>=0.21.0", "black>=22.0.0", "isort>=5.0.0", "flake8>=5.0.0", "mypy>=1.0.0"]
docs = ["sphinx>=5.0.0", "sphinx-rtd-theme>=1.0.0", "sphinx-autodoc-typehints>=1.0.0"]
test = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "pytest-asyncio>=0.21.0", "pytest-timeout>=2.0.0"]

[project.scripts]
fbapi = "fbapi.cli:main"

[project.urls]
Documentation = "https://fbapi.readthedocs.io/"
Homepage = "https://github.com/your-username/fbapi"
Issues = "https://github.com/your-username/fbapi/issues"
Repository = "https://github.com/your-username/fbapi.git"

[tool.black]
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
include = '\.pyi?$'
line-length = 88
target-version = ["py38"]

[tool.isort]
known_first_party = ["fbapi"]
line_length = 88
multi_line_output = 3
profile = "black"

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.8"
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_defs = false
module = "tests.*"

[tool.pytest.ini_options]
addopts = ["--cov=fbapi", "--cov-report=term-missing", "--cov-report=html", "--strict-markers"]
markers = ["unit: Unit tests", "integration: Integration tests", "performance: Performance tests", "slow: Slow running tests"]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fbapi*"]
where = ["src"]
